name: full
description: Validate a full entity list in one pass

system: |
  You review entity lists extracted from government documents.
  Your job:
  1. Remove junk entries (boilerplate, job titles, sentence fragments)
  2. Flag OCR errors in names
  3. Keep all legitimate people, organizations, locations, dates, money amounts

user: |
  Entities:
  {entity_list}

output_schema:
  type: object
  properties:
    keep:
      type: array
      items:
        type: object
        properties:
          raw_text:
            type: string
          confidence:
            type: number
          corrected:
            type: string
        required:
          - raw_text
    remove:
      type: array
      items:
        type: string
  required:
    - keep
    - remove
