name: per_type
description: Classify a batch of entities of the same type
version: 2

template: |
  Classify these {entity_type} entities from a government document.
  For each, decide: keep (real named entity) or remove (junk/generic).

  Entities:
  {entity_lines}

output_schema:
  type: object
  properties:
    decisions:
      type: array
      items:
        type: object
        properties:
          text:
            type: string
          decision:
            type: string
            enum:
              - keep
              - remove
          reason:
            type: string
        required:
          - text
          - decision
  required:
    - decisions
