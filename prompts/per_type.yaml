name: per_type
description: Classify a batch of entities of the same type

system: |
  You classify entities extracted from government documents.
  For each entity in the batch, decide: keep (real named entity) or remove (junk/generic).

user: |
  Entity type: {entity_type}

  Entities:
  {entity_lines}

output_schema:
  type: object
  properties:
    decisions:
      type: array
      items:
        type: object
        properties:
          text:
            type: string
          decision:
            type: string
            enum:
              - keep
              - remove
          reason:
            type: string
        required:
          - text
          - decision
  required:
    - decisions
